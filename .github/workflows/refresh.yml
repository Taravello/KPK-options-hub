name: Daily options refresh

on:
  schedule:
    - cron: "40 7 * * *"   # 07:40 UTC — after the AUM and weETH refreshes
  workflow_dispatch: {}    # manual "run now" trigger

permissions:
  contents: write          # to commit refreshed snapshots
  pages: write             # to deploy the refreshed site (bot pushes don't
  id-token: write          # trigger the pages workflow, so we deploy here)

concurrency:
  group: options-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0, SHA-pinned

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0, SHA-pinned
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh snapshot
        # No secrets: the option board, DVOL and forwards come from the Deribit
        # public API, price history from the Binance public API (Deribit perp
        # fallback). The step exits non-zero if the sources are unreachable,
        # leaving the last good snapshot published.
        run: python refresh.py

      - name: Pricing engine self-test
        run: python validate.py

      - name: Commit refreshed snapshot
        run: |
          git config user.name  "kpk-options-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json options-data.js kpk-options-hub.html
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
          else
            git commit -m "chore: daily options refresh ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d   # v6.0.0, SHA-pinned
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9   # v5.0.0, SHA-pinned
        with:
          path: .

      - name: Deploy to Pages
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128   # v5.0.0, SHA-pinned
